name: Build unpac.exe for Windows

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-windows:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install MinGW Cross-Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: Compile unpac.exe
        run: |
          cd unpac || true
          x86_64-w64-mingw32-gcc -O2 -Wall -Wextra -std=c99 -pedantic -Wno-unused unpac.c -o unpac.exe

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unpac-windows-binary
          path: |
            **/unpac.exe
