name: Build Windows Executables

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-windows:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout spreadtrum_flash Repository
        uses: actions/checkout@v4
        with:
          repository: 'ilyakurdyukov/spreadtrum_flash'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install MinGW Cross-Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: Compile unpac.exe and spd_dump.exe for Windows
        run: |
          # Compile unpac.exe (64-bit Windows)
          x86_64-w64-mingw32-gcc -O2 -Wall -Wextra -std=c99 -pedantic -Wno-unused unpac.c -o unpac.exe

          # Compile spd_dump.exe (64-bit Windows - using serial/standard definitions)
          x86_64-w64-mingw32-gcc -O2 -Wall -Wextra -std=c99 -pedantic -Wno-unused spd_dump.c -o spd_dump.exe

      - name: Upload Windows Executables Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            unpac.exe
            spd_dump.exe
